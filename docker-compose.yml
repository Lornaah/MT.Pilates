services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mtpilates
      POSTGRES_USER: mtpilates
      POSTGRES_PASSWORD: mtpilates
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  pgdata:
