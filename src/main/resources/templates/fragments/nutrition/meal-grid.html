<!--/*
  WeeklyMealGrid : 7 colonnes de repas. Le composant Alpine englobant fournit `gridMeals(day)`, `gridAdd(day, recipe)`,
  `gridRemove(day, idx)`, `gridType(day, idx, type)`, `kcalTarget` et `recipes`.
*/-->
<div th:fragment="grid(readOnly)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-7 gap-2">
  <div th:each="d : ${mealGridDays}" th:data-day="${d.key}" x-data="{ day: $el.dataset.day }"
       class="rounded-md border bg-card p-2 min-h-[200px] flex flex-col">
    <div class="text-[11px] uppercase font-medium text-muted-foreground tracking-wide mb-1.5" th:text="${#strings.substring(d.value, 0, 3)}"></div>

    <div class="flex flex-col gap-1 flex-1">
      <template x-for="(m, idx) in gridMeals(day)" :key="idx">
        <div class="relative flex flex-col" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
          <button type="button" th:disabled="${readOnly}" :style="mealStyle(m.meal_type)"
                  @click="open = !open; open && setTimeout(() => $el.parentElement.querySelector('[data-popover] select')?.focus(), 50)"
                  class="text-[11px] px-1.5 py-1 rounded-sm text-left truncate flex items-center gap-1 transition-opacity"
                  th:classappend="${readOnly} ? '' : 'hover:opacity-80'">
            <span class="truncate flex-1"><template x-if="m.is_free_slot"><em x-text="m.recipe_title"></em></template><template
                  x-if="!m.is_free_slot"><span x-text="m.recipe_title"></span></template></span>
          </button>
          <div th:unless="${readOnly}" data-popover :aria-hidden="!open" class="w-56 p-2 space-y-2 left-1/2 -translate-x-1/2 mt-1 top-full">
            <div class="text-xs font-medium" x-text="m.recipe_title"></div>
            <select class="select h-8 text-xs" :value="m.meal_type" @change="gridType(day, idx, $event.target.value)" aria-label="Type de repas">
              <option th:each="t : ${mealTypes}" th:value="${t.key}" th:text="${t.value}"></option>
              <option value="dessert">Dessert</option>
            </select>
            <button type="button" class="btn w-full justify-start text-destructive text-xs" data-variant="ghost" data-size="sm"
                    @click="open = false; gridRemove(day, idx)">
              <th:block th:utext="${icons.svg('x', 'h-3 w-3')}"></th:block> Retirer
            </button>
          </div>
        </div>
      </template>

      <div th:unless="${readOnly}" class="relative flex flex-col"
           x-data="{ open: false, query: '',
                     get found() { const q = this.query.trim().toLowerCase(); return recipes.filter((r) => r.title.toLowerCase().includes(q)); } }"
           @click.outside="open = false" @keydown.escape="open = false">
        <button type="button" @click="open = !open; query = ''; open && setTimeout(() => $refs.search.focus(), 50)"
                class="text-[11px] px-1.5 py-1 rounded-sm border border-dashed text-muted-foreground hover:bg-muted/50 flex items-center justify-center gap-1">
          <th:block th:utext="${icons.svg('plus', 'h-3 w-3')}"></th:block>
          Ajouter
        </button>
        <div data-popover data-align="start" :aria-hidden="!open" class="p-0 w-64 left-0 mt-1 top-full">
          <div class="flex h-full w-full flex-col overflow-hidden rounded-md bg-popover text-popover-foreground">
            <div class="flex items-center border-b px-3">
              <th:block th:utext="${icons.svg('search', 'mr-2 h-4 w-4 shrink-0 opacity-50')}"></th:block>
              <input x-ref="search" x-model="query" type="text" placeholder="Rechercher une recette…"
                     class="flex h-11 w-full rounded-md bg-transparent py-3 text-sm outline-hidden placeholder:text-muted-foreground">
            </div>
            <div class="max-h-[300px] overflow-y-auto overflow-x-hidden">
              <div x-show="found.length === 0" class="py-6 text-center text-sm">Aucune recette.</div>
              <div x-show="found.length > 0" class="overflow-hidden p-1 text-foreground">
                <template x-for="(r, i) in found" :key="r.id">
                  <div role="option" @click="gridAdd(day, r); open = false"
                       :class="i === 0 ? 'bg-accent text-accent-foreground' : ''"
                       class="relative flex cursor-default select-none items-center rounded-sm px-2 py-1.5 text-sm outline-hidden hover:bg-accent hover:text-accent-foreground">
                    <div class="flex flex-col">
                      <span x-text="r.title"></span>
                      <span x-show="r.calories" class="text-[10px] leading-5 text-muted-foreground" x-text="r.calories + ' kcal'"></span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-1.5 pt-1.5 border-t border-dashed text-[10px] flex items-center gap-1"
         x-data="{ get kcal() { return gridMeals(day).reduce((s, m) => s + (m.calories ?? 0), 0); },
                   get short() { return typeof kcalTarget === 'number' && kcalTarget > 0 && this.kcal < kcalTarget * 0.85; } }">
      <span :class="short ? 'text-amber-600' : 'text-muted-foreground'" x-text="(kcal || '—') + ' kcal'"></span>
      <span x-show="short" class="badge text-[9px] py-0 px-1 h-3.5" data-variant="outline">incomplet</span>
    </div>
  </div>
</div>
