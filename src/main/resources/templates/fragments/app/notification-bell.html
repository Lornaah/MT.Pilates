<!--/* NotificationBell : annonces non lues (pastille), cinq dernières, marquer lu au clic. */-->
<div th:fragment="bell" id="notification-bell" class="relative" th:data-open="${bellOpen == true}"
     x-data="{ open: $el.dataset.open === 'true' }" @click.outside="open = false" @keydown.escape="open = false">
  <button type="button" class="btn relative h-8 w-8" data-variant="ghost" data-size="icon"
          data-tooltip="Annonces" data-side="bottom" aria-label="Annonces" @click="open = !open" :aria-expanded="open">
    <th:block th:utext="${icons.svg('bell', 'h-4 w-4')}"></th:block>
    <span th:if="${bell.unread() > 0}" th:aria-label="|${bell.unread()} non lues|" th:text="${bell.unreadBadge()}"
          class="absolute -top-0.5 -right-0.5 h-4 min-w-4 px-1 rounded-full bg-destructive text-destructive-foreground text-[10px] font-bold flex items-center justify-center"></span>
  </button>
  <div data-popover data-align="end" :aria-hidden="!open" class="w-80 p-0">
    <div class="px-4 py-3 border-b">
      <div class="font-display text-base">Annonces</div>
      <div class="text-xs text-muted-foreground"
           th:text="${bell.unread() == 0 ? 'Aucune nouvelle annonce' : bell.unread() + ' non lue' + (bell.unread() > 1 ? 's' : '')}"></div>
    </div>
    <div class="max-h-80 overflow-auto">
      <p th:if="${bell.latest().isEmpty()}" class="text-sm text-muted-foreground text-center py-8 px-4" th:text="#{bell.empty}"></p>
      <ul th:unless="${bell.latest().isEmpty()}" class="divide-y">
        <li th:each="a : ${bell.latest()}" class="px-4 py-3 cursor-pointer hover:bg-accent transition-colors"
            th:classappend="${a.unread()} ? 'bg-primary/5'"
            th:attr="hx-post=${a.unread()} ? @{/app/announcements/{id}/read(id=${a.id()}, from='bell')} : null"
            hx-target="#notification-bell" hx-swap="outerHTML">
          <div class="flex items-start gap-2">
            <span th:if="${a.unread()}" class="mt-1.5 h-2 w-2 rounded-full bg-primary shrink-0"></span>
            <div class="min-w-0 flex-1">
              <div class="text-sm font-medium truncate" th:text="${a.title()}"></div>
              <div class="text-xs text-muted-foreground line-clamp-2 prose prose-sm max-w-none [&_p]:m-0" th:utext="${a.excerptHtml()}"></div>
              <div class="text-[10px] text-muted-foreground mt-1" th:text="${a.relative()}"></div>
            </div>
          </div>
        </li>
      </ul>
    </div>
    <div class="px-4 py-2 border-t">
      <a th:href="@{/app/announcements}" class="text-xs text-primary hover:underline" @click="open = false">Voir toutes les annonces →</a>
    </div>
  </div>
</div>
