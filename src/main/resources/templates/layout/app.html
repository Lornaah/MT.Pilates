<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<th:block layout:fragment="content">
<!--/* AppLayout de l'original : SidebarProvider (repli en icônes, Ctrl/Cmd+B, tiroir mobile) + en-tête + contenu. */-->
<div class="group/sidebar-wrapper flex min-h-svh w-full" style="--sidebar-width: 16rem; --sidebar-width-icon: 4rem;"
     x-data="{ collapsed: false, mobileOpen: false }"
     @keydown.window.ctrl.b.prevent="collapsed = !collapsed" @keydown.window.meta.b.prevent="collapsed = !collapsed">
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>
  <div class="h-dvh flex w-full overflow-hidden">

    <div class="group peer text-sidebar-foreground md:block" data-variant="sidebar" data-side="left"
         :data-state="collapsed ? 'collapsed' : 'expanded'" :data-collapsible="collapsed ? 'icon' : ''">
      <div class="relative hidden h-svh w-(--sidebar-width) bg-transparent transition-[width] duration-200 ease-linear md:block group-data-[collapsible=icon]:w-(--sidebar-width-icon)"></div>
      <div x-show="mobileOpen" x-cloak x-transition.opacity.duration.300ms @click="mobileOpen = false"
           class="fixed inset-0 z-50 bg-black/80 md:hidden"></div>
      <aside class="fixed inset-y-0 left-0 z-50 flex h-svh w-[18rem] flex-col bg-sidebar text-sidebar-foreground shadow-lg border-r transition-transform duration-300 ease-in-out sm:max-w-sm
                    md:z-10 md:w-(--sidebar-width) md:translate-x-0 md:shadow-none md:transition-[left,right,width] md:duration-200 md:ease-linear md:group-data-[collapsible=icon]:w-(--sidebar-width-icon)"
             :class="mobileOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'"
             data-sidebar="sidebar" aria-label="Menu latéral">
        <div class="flex items-center gap-2 px-4 h-12 border-b border-sidebar-border">
          <div class="h-8 w-8 rounded-full bg-gradient-warm flex items-center justify-center shrink-0">
            <img th:src="@{/images/logo-icon.png}" alt="MT Pilates" class="h-4 w-4 object-contain">
          </div>
          <a th:href="@{/}" x-show="!collapsed">
            <div class="font-display text-lg leading-none">MT Pilates</div>
            <div class="text-[10px] uppercase tracking-widest text-muted-foreground mt-1">Coach Pilates</div>
          </a>
        </div>

        <div class="flex min-h-0 flex-1 flex-col gap-2 overflow-auto group-data-[collapsible=icon]:overflow-hidden px-2 py-2">
          <th:block th:each="zone : ${sidebar.get().zones()}">
            <div x-show="!collapsed" class="px-3 pt-3 pb-1 text-[10px] font-medium uppercase tracking-widest text-muted-foreground/80"
                 th:text="${zone.title()}"></div>
            <div th:each="group : ${zone.groups()}" class="relative flex w-full min-w-0 flex-col p-2">
              <div th:if="${group.title().isPresent()}" x-show="!collapsed"
                   class="flex h-8 shrink-0 items-center rounded-md px-2 text-[10px] font-medium uppercase tracking-wide text-muted-foreground/60 outline-hidden ring-sidebar-ring transition-[margin,opacity] duration-200 ease-linear focus-visible:ring-2 group-data-[collapsible=icon]:-mt-8 group-data-[collapsible=icon]:opacity-0"
                   th:text="${group.title().get()}"></div>
              <div class="w-full text-sm">
                <ul class="flex w-full min-w-0 flex-col gap-1">
                  <li th:each="link : ${group.links()}" class="group/menu-item relative">
                    <a th:href="@{${link.path()}}" data-size="default"
                       th:attr="data-active=${link.active()}, data-label=${link.label()}"
                       :data-tooltip="collapsed ? $el.dataset.label : null" data-side="right"
                       th:classappend="${link.active()} ? 'bg-primary text-primary-foreground hover:bg-primary/90 hover:text-primary-foreground'"
                       class="peer/menu-button flex w-full items-center gap-2 overflow-hidden rounded-md p-2 text-left text-sm outline-hidden ring-sidebar-ring transition-[width,height,padding] hover:bg-sidebar-accent hover:text-sidebar-accent-foreground focus-visible:ring-2 active:bg-sidebar-accent active:text-sidebar-accent-foreground data-[active=true]:bg-sidebar-accent data-[active=true]:font-medium data-[active=true]:text-sidebar-accent-foreground group-data-[collapsible=icon]:size-8! group-data-[collapsible=icon]:p-2! [&>span:last-child]:truncate [&>svg]:size-4 [&>svg]:shrink-0 h-8"
                       @click="mobileOpen = false">
                      <th:block th:utext="${icons.svg(link.icon(), 'h-4 w-4 shrink-0')}"></th:block>
                      <span th:text="${link.label()}"></span>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </th:block>
        </div>

        <div th:replace="~{fragments/app/user-menu :: userMenu}"></div>
      </aside>
    </div>

    <div class="flex-1 flex flex-col min-w-0 min-h-0 border-l border-border">
      <div th:replace="~{fragments/app/view-as-banner :: banner}"></div>
      <header class="h-12 flex items-center justify-between border-b border-border px-2 md:px-4 bg-background sticky top-0 z-30">
        <button type="button" class="btn h-9 w-9 md:h-8 md:w-8" data-variant="ghost" data-size="icon"
                aria-label="Ouvrir le menu latéral" data-tooltip="Menu latéral" data-side="right"
                @click="window.matchMedia('(min-width: 768px)').matches ? collapsed = !collapsed : mobileOpen = true"
                th:utext="${icons.svg('panel-left')}"></button>
        <div class="flex items-center gap-1">
          <div th:replace="~{fragments/app/notification-bell :: bell}"></div>
          <div th:replace="~{fragments/app/install-app :: installButton}"></div>
        </div>
      </header>
      <main class="flex-1 min-h-0 min-w-0 overflow-y-auto overflow-x-hidden" id="main-content">
        <div class="animate-page-enter">
          <th:block layout:fragment="page"></th:block>
        </div>
      </main>
    </div>
  </div>
</div>
</th:block>
</body>
</html>
