<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/app}">
<head><title>Annonces — MT Pilates</title></head>
<body>
<th:block layout:fragment="page">
  <div class="container py-8 space-y-6 max-w-3xl">
    <div>
      <h1 class="font-display text-3xl md:text-4xl md:leading-10">Annonces</h1>
      <p class="text-muted-foreground italic mt-1">Toutes les communications de ton équipe coaching.</p>
    </div>
    <div th:replace="~{::list}"></div>
  </div>
</th:block>

<div th:fragment="list" id="announcement-list">
  <th:block th:if="${items.isEmpty()}">
    <div th:replace="~{fragments/ui/components :: emptyState('megaphone', 'Aucune annonce', #{announcements.member.empty}, null)}"></div>
  </th:block>
  <div th:unless="${items.isEmpty()}" class="space-y-4">
    <div th:each="a : ${items}" class="card overflow-hidden cursor-pointer hover:shadow-elevated transition-shadow"
         th:attr="hx-post=${a.unread()} ? @{/app/announcements/{id}/read(id=${a.id()})} : null"
         hx-target="#announcement-list" hx-swap="outerHTML">
      <img th:if="${a.coverUrl().isPresent()}" th:src="${a.coverUrl().get()}" alt="" class="w-full h-40 object-cover" loading="lazy">
      <section class="pt-5 pb-5 space-y-2">
        <div class="flex items-start justify-between gap-3">
          <h2 class="font-display text-xl leading-7" th:text="${a.title()}"></h2>
          <span th:if="${a.unread()}" class="badge" data-variant="default">Nouveau</span>
        </div>
        <div class="text-xs text-muted-foreground" th:text="${a.dateLabel()}"></div>
        <div class="prose prose-sm max-w-none" th:utext="${a.bodyHtml()}"></div>
      </section>
    </div>
  </div>
</div>
</body>
</html>
