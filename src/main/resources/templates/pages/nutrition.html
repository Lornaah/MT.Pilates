<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/app}">
<head><title>Nutrition — MT Pilates</title></head>
<body>
<th:block layout:fragment="page">
  <!--/* NutritionHub : l'en-tête suit l'onglet actif (?tab=), seul le contenu de l'onglet est rendu. */-->
  <!--/* z-10 : l'animation crée un contexte d'empilement ; le popover d'aide (portail Radix dans l'original) doit passer devant. */-->
  <div class="animate-fade-in relative z-10">
    <div th:replace="~{fragments/ui/components :: pageHeader(${header.eyebrow()}, ${header.title()}, ${header.description()},
         ${tab == 'overview'} ? ~{fragments/nutrition/overview :: helpButton} : null, null, null, null)}"></div>
  </div>
  <div class="tabs">
    <div class="tabs-bar container pt-6">
      <nav role="tablist" class="flex-wrap">
        <a role="tab" href="/app/coach/nutrition?tab=overview" th:aria-selected="${tab == 'overview'}">
          <th:block th:utext="${icons.svg('layout-dashboard', 'h-4 w-4 mr-1')}"></th:block> Vue d'ensemble
        </a>
        <a role="tab" href="/app/coach/nutrition?tab=recipes" th:aria-selected="${tab == 'recipes'}">
          <th:block th:utext="${icons.svg('utensils-crossed', 'h-4 w-4 mr-1')}"></th:block> Recettes
        </a>
        <a role="tab" href="/app/coach/nutrition?tab=foods" th:aria-selected="${tab == 'foods'}">
          <th:block th:utext="${icons.svg('apple', 'h-4 w-4 mr-1')}"></th:block> Aliments
        </a>
        <a role="tab" href="/app/coach/nutrition?tab=templates" th:aria-selected="${tab == 'templates'}">
          <th:block th:utext="${icons.svg('book-open', 'h-4 w-4 mr-1')}"></th:block> Menus types
        </a>
      </nav>
    </div>
    <div role="tabpanel" class="mt-2">
      <th:block th:if="${tab == 'overview'}"><div th:replace="~{fragments/nutrition/overview :: overview}"></div></th:block>
      <th:block th:if="${tab == 'recipes'}"><div th:replace="~{fragments/nutrition/recipes :: library}"></div></th:block>
      <th:block th:if="${tab == 'foods'}"><div th:replace="~{fragments/nutrition/foods :: library}"></div></th:block>
      <th:block th:if="${tab == 'templates'}"><div th:replace="~{fragments/nutrition/templates :: library}"></div></th:block>
    </div>
  </div>
  <div id="nutrition-dialog-slot"></div>
</th:block>
</body>
</html>
