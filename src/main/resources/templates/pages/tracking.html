<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/app}">
<head><title>Mon suivi — MT Pilates</title></head>
<body>
<th:block layout:fragment="page">
  <div th:replace="~{fragments/ui/components :: pageHeader('Suivi', 'Mon suivi', 'Entrez vos mensurations et signalez vos problèmes régulièrement.', ~{::newEntry}, null, null, null)}"></div>
  <th:block th:if="${false}">
    <button th:fragment="newEntry" type="button" class="btn" data-variant="hero"
            onclick="document.getElementById('tracking-entry').showModal()">
      <th:block th:utext="${icons.svg('plus', 'h-4 w-4')}"></th:block> Nouvelle entrée
    </button>
  </th:block>

  <div class="container py-8 space-y-6 max-w-4xl">
    <div th:replace="~{::reviews}"></div>
    <div th:replace="~{fragments/tracking/photos :: card(${memberId}, ${photos})}"></div>
    <div th:replace="~{::entries}"></div>
  </div>

  <dialog th:replace="~{fragments/tracking/photos :: uploadDialog(${memberId}, ${today})}"></dialog>

  <dialog id="tracking-entry" class="dialog" aria-labelledby="tracking-entry-title">
    <form class="max-h-[90vh] overflow-y-auto" hx-post="/app/tracking/entries" hx-target="#tracking-entries"
          hx-swap="outerHTML" hx-indicator="find button[type=submit]">
      <header><h2 id="tracking-entry-title" class="font-display text-2xl leading-8">Nouvelle entrée de suivi</h2></header>
      <div class="space-y-4">
        <div class="space-y-2">
          <label class="label" for="entry-date">Date</label>
          <div th:replace="~{fragments/ui/components :: datePicker('entry-date', 'date', ${today}, 'Date', false, null)}"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div th:each="measure : ${measures}" class="space-y-1">
            <label class="label text-xs leading-4" th:for="|entry-${measure.param()}|" th:text="${measure.label()}"></label>
            <input class="input" type="number" step="0.1" placeholder="—" th:id="|entry-${measure.param()}|"
                   th:name="${measure.param()}">
          </div>
        </div>
        <div class="space-y-2">
          <label class="label" for="entry-notes">Notes / Problèmes ponctuels</label>
          <textarea class="textarea" id="entry-notes" name="notes" rows="3"
                    placeholder="Douleur au bas du dos, fatigue, etc."></textarea>
        </div>
      </div>
      <footer th:insert="~{fragments/ui/components :: formDialogFooter(null)}"></footer>
      <button type="button" class="dialog-close" aria-label="Fermer" onclick="this.closest('dialog').close()"
              th:utext="${icons.svg('x', 'h-4 w-4')}"></button>
    </form>
  </dialog>

  <dialog id="weekly-review" class="dialog" aria-labelledby="weekly-review-title">
    <form class="max-h-[90vh] overflow-y-auto" hx-post="/app/tracking/reviews" hx-target="#weekly-reviews"
          hx-swap="outerHTML" hx-indicator="find button[type=submit]" x-data="{ score: 7 }"
          @reset="score = 7">
      <header><h2 id="weekly-review-title" class="font-display text-2xl leading-8">Bilan hebdomadaire</h2></header>
      <div class="space-y-4">
        <div class="space-y-2">
          <label class="label" for="review-week">Semaine du</label>
          <div th:replace="~{fragments/ui/components :: datePicker('review-week', 'weekStart', ${weekStart}, 'Semaine du', false, null)}"></div>
        </div>
        <div class="space-y-2">
          <label class="label" for="review-score">Bien-être mental (<span x-text="score">7</span>/10)</label>
          <input id="review-score" type="range" name="score" min="1" max="10" x-model.number="score"
                 class="w-full accent-primary">
        </div>
        <div class="space-y-2">
          <label class="label" for="review-note">Note libre</label>
          <textarea class="textarea" id="review-note" name="note" rows="4"
                    placeholder="Ce qui s'est bien passé, les difficultés, les questions au coach…"></textarea>
        </div>
      </div>
      <footer th:insert="~{fragments/ui/components :: formDialogFooter(null)}"></footer>
      <button type="button" class="dialog-close" aria-label="Fermer" onclick="this.closest('dialog').close()"
              th:utext="${icons.svg('x', 'h-4 w-4')}"></button>
    </form>
  </dialog>
</th:block>

<!--/* WeeklyReviewMemberCard. */-->
<div th:fragment="reviews" id="weekly-reviews" class="card">
  <header class="flex flex-row items-center justify-between">
    <h3 class="font-display text-lg leading-7 flex items-center gap-2">
      <th:block th:utext="${icons.svg('heart', 'h-4 w-4 text-primary')}"></th:block>
      Bilan de la semaine
    </h3>
    <button type="button" class="btn" data-variant="hero" data-size="sm"
            onclick="document.getElementById('weekly-review').showModal()">Nouveau bilan</button>
  </header>
  <section class="space-y-2">
    <th:block th:if="${reviews.isEmpty()}">
      <div th:replace="~{fragments/ui/components :: emptyState(null, null, 'Aucun bilan encore.', null)}"></div>
    </th:block>
    <div th:each="review : ${reviews}" class="flex items-start gap-3 p-3 rounded-lg bg-muted/40">
      <span class="badge rounded-full whitespace-nowrap" data-variant="secondary" th:text="${review.weekLabel()}"></span>
      <div class="flex-1 min-w-0">
        <div class="text-sm">Bien-être <span class="font-display text-base" th:text="|${review.wellbeing()}/10|"></span></div>
        <p th:if="${review.note().isPresent()}" class="text-sm text-muted-foreground whitespace-pre-wrap mt-1"
           th:text="${review.note().get()}"></p>
      </div>
      <th:block th:with="dialogId=|delete-review-${review.id()}|">
        <button type="button" class="btn text-destructive" data-variant="ghost" data-size="sm" aria-label="Supprimer"
                th:attr="data-dialog=${dialogId}" onclick="document.getElementById(this.dataset.dialog).showModal()"
                th:utext="${icons.svg('trash-2', 'h-4 w-4')}"></button>
        <dialog class="alert-dialog" th:id="${dialogId}">
          <div>
            <header><h2>Supprimer ce bilan ?</h2><p>Ce bilan sera définitivement effacé.</p></header>
            <footer>
              <button type="button" class="btn mt-2 sm:mt-0" data-variant="outline" onclick="this.closest('dialog').close()">Annuler</button>
              <button type="button" class="btn" data-variant="destructive"
                      th:attr="hx-delete=@{/app/tracking/reviews/{id}(id=${review.id()})}"
                      hx-target="#weekly-reviews" hx-swap="outerHTML"
                      onclick="this.closest('dialog').close()">Supprimer</button>
            </footer>
          </div>
        </dialog>
      </th:block>
    </div>
  </section>
</div>

<!--/* Entrées de mensurations, avec tendance par rapport à l'entrée précédente (une baisse est un progrès). */-->
<div th:fragment="entries" id="tracking-entries" class="space-y-6">
  <th:block th:if="${entries.isEmpty()}">
    <div th:replace="~{fragments/ui/components :: emptyState(null, null, 'Aucune entrée de suivi. Commencez par ajouter vos premières mensurations.', null)}"></div>
  </th:block>
  <div th:each="entry : ${entries}" class="card">
    <header class="pb-2">
      <div class="flex items-center justify-between">
        <h3 class="font-display text-lg leading-7 flex items-center gap-2">
          <th:block th:utext="${icons.svg('calendar-days', 'h-4 w-4 text-primary')}"></th:block>
          <th:block th:text="${entry.dateLabel()}"></th:block>
        </h3>
        <th:block th:with="dialogId=|delete-entry-${entry.id()}|">
          <button type="button" class="btn text-destructive" data-variant="ghost" data-size="sm" aria-label="Supprimer"
                  th:attr="data-dialog=${dialogId}" onclick="document.getElementById(this.dataset.dialog).showModal()"
                  th:utext="${icons.svg('trash-2', 'h-4 w-4')}"></button>
          <dialog class="alert-dialog" th:id="${dialogId}">
            <div>
              <header><h2>Supprimer cette entrée ?</h2><p>Cette entrée de suivi sera définitivement effacée.</p></header>
              <footer>
                <button type="button" class="btn mt-2 sm:mt-0" data-variant="outline" onclick="this.closest('dialog').close()">Annuler</button>
                <button type="button" class="btn" data-variant="destructive"
                        th:attr="hx-delete=@{/app/tracking/entries/{id}(id=${entry.id()})}"
                        hx-target="#tracking-entries" hx-swap="outerHTML"
                        onclick="this.closest('dialog').close()">Supprimer</button>
              </footer>
            </div>
          </dialog>
        </th:block>
      </div>
    </header>
    <section>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div th:each="m : ${entry.values()}" class="bg-muted/50 rounded-lg p-3">
          <div class="text-xs text-muted-foreground" th:text="${m.label()}"></div>
          <div class="font-display text-lg flex items-center gap-1">
            <th:block th:text="${m.value()}"></th:block> <span class="text-xs text-muted-foreground" th:text="${m.unit()}"></span>
            <th:block th:switch="${m.trend().name()}">
              <th:block th:case="'DOWN'" th:utext="${icons.svg('trending-down', 'h-3 w-3 text-green-500')}"></th:block>
              <th:block th:case="'UP'" th:utext="${icons.svg('trending-up', 'h-3 w-3 text-orange-500')}"></th:block>
              <th:block th:case="'SAME'" th:utext="${icons.svg('minus', 'h-3 w-3 text-muted-foreground')}"></th:block>
            </th:block>
          </div>
        </div>
      </div>
      <div th:if="${entry.notes().isPresent()}" class="mt-3 p-3 rounded-lg bg-amber-500/10 border border-amber-500/20">
        <div class="text-xs font-medium text-amber-700 mb-1">Notes / Problèmes</div>
        <p class="text-sm whitespace-pre-wrap" th:text="${entry.notes().get()}"></p>
      </div>
    </section>
  </div>
</div>
</body>
</html>
