<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Confirmez votre adresse email</title></head>
<body style="margin:0;padding:0;background:#f8f4ee;font-family:Inter,Arial,sans-serif;color:#350f0f;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8f4ee;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#fcfaf6;border:1px solid #e3d6c8;border-radius:16px;">
        <tr><td style="padding:32px;">
          <p style="margin:0 0 4px;font-family:Georgia,serif;font-size:22px;">MT Pilates</p>
          <p style="margin:0 0 24px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#6b3a3a;">Coach Pilates</p>
          <p style="margin:0 0 16px;font-size:15px;line-height:1.6;">Bonjour,</p>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.6;">
            Confirmez votre adresse email pour finaliser la création de votre espace MT Pilates.
          </p>
          <p style="margin:0 0 24px;">
            <a th:href="${confirmationLink}" href="#"
               style="display:inline-block;background:#b04a11;color:#fcfaf6;text-decoration:none;padding:12px 28px;border-radius:9999px;font-size:15px;font-weight:500;">
              Confirmer mon adresse
            </a>
          </p>
          <p style="margin:0;font-size:13px;line-height:1.6;color:#6b3a3a;">
            Ce lien est valable 24 heures. Si vous n'êtes pas à l'origine de cette demande, ignorez cet email.
          </p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
