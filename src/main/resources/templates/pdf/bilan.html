<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
<meta charset="UTF-8"/>
<title th:text="${title}">Bilan</title>
<!--/*
  Bilan PDF au format du document de référence : paysage 16:9, fond crème, titres capitales sans-serif, corps serif,
  encarts taupe. XHTML strict (openhtmltopdf) : pas de flex ni de grid, positionnement absolu dans chaque page.
*/-->
<style>
  @page { size: 1200px 676px; margin: 0; }
  body { margin: 0; font-family: serif; color: #4A4336; background: #F8F5EF; }
  .page { position: relative; width: 1200px; height: 676px; overflow: hidden; background: #F8F5EF; page-break-after: always; }
  .page.last { page-break-after: auto; }
  .sans { font-family: sans-serif; }
  .title { font-family: sans-serif; font-weight: bold; color: #4A4336; font-size: 40px; line-height: 1.15; margin: 0; }
  .title.center { text-align: center; }
  .lead { font-size: 19px; line-height: 1.6; color: #6E6358; }
  .body { font-size: 17px; line-height: 1.55; color: #3F382F; }
  .muted { color: #6E6358; }
  .box { background: #D4C4B2; border-radius: 18px; padding: 18px 22px; }
  .box-light { background: #E3DACF; border-radius: 14px; padding: 18px 22px; }
  .tile { background: #EFE8DE; border-radius: 14px; padding: 16px 18px; }
  .hl { background: #D9CDBF; padding: 0 3px; }
  strong { font-weight: bold; }
  .big { font-family: sans-serif; font-weight: bold; font-size: 56px; color: #6E6358; line-height: 1.05; }
  .label { font-family: sans-serif; font-weight: bold; font-size: 20px; color: #6E6358; }
  .icon { width: 22px; height: 22px; vertical-align: middle; }
  .photo-frame { background: #FFFFFF; border-radius: 14px; padding: 8px; }
  .photo { height: 100%; border-radius: 6px; }
  table.cols { border-collapse: separate; border-spacing: 0; width: 100%; }
  table.cols td { vertical-align: top; }
</style>
</head>
<body th:with="d=${doc}">

<!--/* 1. Couverture */-->
<div class="page">
  <div style="position: absolute; left: 60px; right: 60px; top: 190px;">
    <h1 class="title center" th:utext="${d.text('couverture.titre')}"></h1>
    <p class="lead" style="text-align: center; margin: 26px 0 30px 0;" th:utext="${d.text('couverture.intro')}"></p>
    <table class="cols"><tr>
      <td style="width: 50%; padding-right: 28px;"><div class="box sans" style="font-size: 18px; line-height: 1.45;" th:utext="${d.text('couverture.encart')}"></div></td>
      <td style="width: 50%; padding: 14px 0 0 0;"><div class="sans" style="font-size: 18px; line-height: 1.45;" th:utext="${d.text('couverture.texte')}"></div></td>
    </tr></table>
  </div>
</div>

<!--/* 2. Tes résultats en chiffres */-->
<div class="page" th:unless="${d.tiles().isEmpty()}" th:with="wide=${d.hero().isEmpty()}">
  <div th:style="|position: absolute; left: 56px; top: 44px; width: ${wide ? 1088 : 640}px;|">
    <h1 class="title" style="text-align: center;" th:utext="${d.text('chiffres.titre')}"></h1>
    <p class="muted" style="font-size: 16px; margin: 18px 0 14px 0;" th:utext="${d.text('chiffres.intro')}"></p>
    <table class="cols">
      <tr th:each="row : ${#numbers.sequence(0, (d.tiles().size() - 1) / 3)}">
        <td th:each="col : ${#numbers.sequence(0, 2)}" style="width: 33%; text-align: center; padding: 6px 8px 14px 8px;"
            th:with="i=${row * 3 + col}">
          <th:block th:if="${i lt d.tiles().size()}" th:with="t=${d.tiles().get(i)}">
            <div class="big" th:text="${t.value()}"></div>
            <div class="label" style="margin-top: 8px;" th:text="${t.label()}"></div>
            <div class="muted" style="font-size: 15px; line-height: 1.5; margin-top: 6px;" th:utext="${t.caption()}"></div>
          </th:block>
        </td>
      </tr>
    </table>
    <div class="box-light body" style="margin-top: 6px;" th:if="${d.has('chiffres.note')}">
      <img class="icon" th:src="${icons.note}" alt=""/> <span th:utext="${d.text('chiffres.note')}"></span>
    </div>
  </div>
  <div th:if="${d.hero().isPresent()}" style="position: absolute; right: 0; top: 0; width: 470px; height: 676px; background: #E9E2D7;">
    <img th:src="${d.hero().get()}" alt="" style="position: absolute; left: 35px; top: 60px; height: 556px; max-width: 400px; border-radius: 14px;"/>
  </div>
</div>

<!--/* 3. Pages photo par vue : photos à gauche (dos, face) ou à droite (profil) */-->
<div class="page" th:each="v : ${d.views()}" th:with="key=|vue.${v.slug()}|, photosLeft=${v.slug() != 'profil'}">
  <div th:style="|position: absolute; top: 0; height: 676px; width: 760px; background: #CDBFB2; ${photosLeft ? 'left: 0;' : 'right: 0;'}|">
    <table class="photo-frame" style="position: absolute; left: 22px; top: 110px; width: 700px; height: 456px; border-collapse: separate; border-spacing: 8px 0;">
      <tr>
        <td style="width: 50%; text-align: center;"><img th:src="${v.before()}" alt="Avant" style="height: 440px; max-width: 340px; border-radius: 6px;"/></td>
        <td style="width: 50%; text-align: center;"><img th:src="${v.after()}" alt="Après" style="height: 440px; max-width: 340px; border-radius: 6px;"/></td>
      </tr>
      <tr><td class="sans muted" style="text-align: center; font-size: 13px; padding-top: 4px;">Avant</td>
          <td class="sans muted" style="text-align: center; font-size: 13px; padding-top: 4px;">Après</td></tr>
    </table>
  </div>
  <div th:style="|position: absolute; top: 40px; width: 380px; ${photosLeft ? 'right: 40px;' : 'left: 40px;'}|">
    <h1 class="title" style="font-size: 26px; text-align: center;" th:utext="${d.text(key + '.titre')}"></h1>
    <p class="muted" style="font-size: 15px; line-height: 1.55; margin: 16px 0 12px 0;" th:utext="${d.text(key + '.intro')}"></p>
    <th:block th:each="p : ${d.pointsOf(key + '.points')}">
      <div th:if="${photosLeft}" style="margin-bottom: 14px;">
        <div class="label" style="font-size: 18px;"><img class="icon" th:src="${icons.check}" alt=""/> <th:block th:utext="${p.title()}"></th:block></div>
        <div class="muted" style="font-size: 14px; line-height: 1.5; margin: 4px 0 0 30px;" th:utext="${p.text()}"></div>
      </div>
      <div th:unless="${photosLeft}" class="tile" style="text-align: center; margin-bottom: 12px;">
        <div class="label" style="font-size: 18px;"><img class="icon" th:src="${icons.check}" alt=""/> <th:block th:utext="${p.title()}"></th:block></div>
        <div class="muted" style="font-size: 14px; line-height: 1.5; margin-top: 4px;" th:utext="${p.text()}"></div>
      </div>
    </th:block>
    <p class="muted" style="font-size: 15px; line-height: 1.55;" th:if="${d.has(key + '.conclusion')}" th:utext="${d.text(key + '.conclusion')}"></p>
  </div>
</div>

<!--/* 4. L'évolution de ton poids */-->
<div class="page" th:if="${d.weightChart().isPresent()}">
  <div style="position: absolute; left: 60px; right: 60px; top: 70px;">
    <h1 class="title center" style="font-size: 26px;" th:utext="${d.text('poids.titre')}"></h1>
    <div style="text-align: center; margin-top: 18px;"><img th:src="${d.weightChart().get()}" alt="" style="width: 820px; height: 360px;"/></div>
    <p class="body" style="text-align: center; margin-top: 18px;" th:utext="${d.text('poids.texte')}"></p>
  </div>
</div>

<!--/* 5. Une page par mensuration : encart à gauche, graphique à droite (et inversement une page sur deux) */-->
<div class="page" th:each="m, it : ${d.measures()}" th:with="key=|mesure.${m.slug()}|, boxLeft=${it.even}">
  <div th:style="|position: absolute; top: 60px; width: 500px; ${boxLeft ? 'left: 54px;' : 'right: 54px;'}|" class="box">
    <h1 class="title" style="font-size: 36px;" th:utext="${d.text(key + '.titre')}"></h1>
    <div class="big" style="font-size: 54px; margin: 8px 0 10px 0;" th:text="${m.delta()}"></div>
    <p class="body" style="margin: 0 0 10px 0;" th:utext="${d.text(key + '.sous_titre')}"></p>
    <p class="body" style="margin: 0 0 10px 0;" th:if="${d.has(key + '.texte')}" th:utext="${d.text(key + '.texte')}"></p>
    <table class="cols" th:unless="${d.pointsOf(key + '.points').isEmpty()}">
      <tr th:each="p : ${d.pointsOf(key + '.points')}">
        <td style="width: 34px; padding-top: 2px;"><img class="icon" th:src="${icons.arrow}" alt=""/></td>
        <td style="padding-bottom: 10px;"><div class="sans" style="font-weight: bold; font-size: 17px;" th:utext="${p.title()}"></div>
            <div class="body" style="font-size: 15px;" th:utext="${p.text()}"></div></td>
      </tr>
    </table>
    <div class="box-light body" style="margin-top: 6px; background: #E3DACF;" th:if="${d.has(key + '.note')}">
      <img class="icon" th:src="${icons.note}" alt=""/> <span th:utext="${d.text(key + '.note')}"></span>
    </div>
  </div>
  <div th:style="|position: absolute; top: 110px; width: 600px; ${boxLeft ? 'right: 30px;' : 'left: 30px;'}|">
    <img th:src="${m.chart()}" alt="" style="width: 600px; height: 300px;"/>
  </div>
</div>

<!--/* 6. Ce que ces résultats veulent dire */-->
<div class="page">
  <div style="position: absolute; left: 66px; right: 66px; top: 100px;">
    <h1 class="title center" th:utext="${d.text('sens.titre')}"></h1>
    <p class="body" style="font-size: 19px; margin: 22px 0 18px 0;" th:utext="${d.text('sens.intro')}"></p>
    <table class="cols" style="background: #EFE8DE; border-radius: 12px;">
      <tr th:each="row : ${#numbers.sequence(0, (d.pointsOf('sens.points').size() - 1) / 2)}" th:if="${!d.pointsOf('sens.points').isEmpty()}">
        <td th:each="col : ${#numbers.sequence(0, 1)}" style="width: 50%; padding: 16px 18px;" th:with="i=${row * 2 + col}">
          <th:block th:if="${i lt d.pointsOf('sens.points').size()}" th:with="p=${d.pointsOf('sens.points').get(i)}">
            <div class="label" th:utext="${p.title()}"></div>
            <div class="muted" style="font-size: 15px; margin-top: 4px;" th:utext="${p.text()}"></div>
          </th:block>
        </td>
      </tr>
    </table>
    <div class="muted" style="border-left: 2px solid #CDBFB2; padding: 8px 0 8px 22px; margin-top: 20px; font-size: 15px; line-height: 1.6;"
         th:utext="${d.text('sens.citation')}"></div>
  </div>
</div>

<!--/* 7. Mais le plus important */-->
<div class="page" th:with="wide=${d.hero().isEmpty()}">
  <div th:style="|position: absolute; left: 66px; top: 44px; width: ${wide ? 1068 : 650}px;|">
    <h1 class="title" th:utext="${d.text('important.titre')}"></h1>
    <p class="lead" style="margin: 18px 0 10px 0;" th:utext="${d.text('important.intro')}"></p>
    <div th:each="p, it : ${d.pointsOf('important.points')}" style="margin-top: 14px;">
      <div class="sans muted" style="font-size: 13px; border-bottom: 2px solid #D4C4B2; padding-bottom: 4px;"
           th:text="${it.count lt 10 ? '0' + it.count : it.count}"></div>
      <div class="label" style="margin-top: 8px;" th:utext="${p.title()}"></div>
      <div class="muted" style="font-size: 15px; margin-top: 4px;" th:utext="${p.text()}"></div>
    </div>
    <div style="background: #B2A69A; color: #F8F5EF; border-radius: 14px; padding: 18px 22px; margin-top: 22px; font-size: 19px; line-height: 1.55;">
      <img class="icon" th:src="${icons.circleCheck}" alt=""/> <span th:utext="${d.text('important.encart')}"></span>
    </div>
  </div>
  <div th:if="${d.hero().isPresent()}" style="position: absolute; right: 0; top: 0; width: 420px; height: 676px; background: #E9E2D7;">
    <img th:src="${d.hero().get()}" alt="" style="position: absolute; left: 30px; top: 60px; height: 556px; max-width: 360px; border-radius: 14px;"/>
  </div>
</div>

<!--/* 8. L'évolution vers ton objectif */-->
<div class="page" th:if="${d.objective().isPresent()}" th:with="o=${d.objective().get()}">
  <div style="position: absolute; left: 66px; right: 66px; top: 110px; text-align: center;">
    <h1 class="title center" th:utext="${d.text('objectif.titre')}"></h1>
    <p class="sans" style="font-size: 19px; line-height: 1.6; margin: 14px 0 40px 0;" th:utext="${d.text('objectif.intro')}"></p>
    <p class="sans" style="font-size: 19px; line-height: 1.4; margin: 0 0 22px 0;" th:utext="${d.text('objectif.situation')}"></p>
    <table class="cols"><tr>
      <td style="vertical-align: middle;"><div style="background: #EFE8DE; border-radius: 12px; height: 22px;">
        <div th:style="|background: #B2A69A; border-radius: 12px; height: 22px; width: ${o.percent()}%;|"></div></div></td>
      <td class="sans" style="width: 90px; text-align: right; font-weight: bold; font-size: 20px; color: #6E6358; vertical-align: middle;" th:text="${o.percentLabel()}"></td>
    </tr></table>
    <div class="label" style="margin-top: 22px;">Progrès réalisé</div>
    <p class="muted" style="font-size: 15px; margin: 10px 0 24px 0;" th:utext="${d.text('objectif.progression')}"></p>
    <p class="sans" style="font-size: 24px; line-height: 1.35; font-weight: bold;" th:utext="${d.text('objectif.conclusion')}"></p>
  </div>
</div>

<!--/* 9. Sois fière de toi */-->
<div class="page last">
  <div style="position: absolute; left: 66px; right: 66px; top: 50px;">
    <h1 class="title center" th:utext="${d.text('fierte.titre')}"></h1>
    <p class="lead" style="margin: 22px 0 18px 0;" th:utext="${d.text('fierte.intro')}"></p>
    <table class="cols" style="border-spacing: 16px 14px; margin: 0 -16px;">
      <tr th:each="row : ${#numbers.sequence(0, (d.pointsOf('fierte.points').size() - 1) / 2)}" th:if="${!d.pointsOf('fierte.points').isEmpty()}">
        <td th:each="col : ${#numbers.sequence(0, 1)}" style="width: 50%;" th:with="i=${row * 2 + col}">
          <div class="tile" th:if="${i lt d.pointsOf('fierte.points').size()}" th:with="p=${d.pointsOf('fierte.points').get(i)}">
            <div class="label"><img class="icon" th:src="${icons.check}" alt=""/> <th:block th:utext="${p.title()}"></th:block></div>
            <div class="muted" style="font-size: 15px; margin-top: 6px;" th:utext="${p.text()}"></div>
          </div>
        </td>
      </tr>
    </table>
    <div style="border-left: 2px solid #CDBFB2; padding: 10px 0 10px 24px; margin-top: 12px;">
      <div class="sans" style="font-size: 32px; font-weight: bold; line-height: 1.3;" th:utext="${d.text('fierte.citation')}"></div>
      <div class="muted" style="font-size: 15px; margin-top: 18px;" th:utext="${d.text('fierte.signature')}"></div>
    </div>
  </div>
</div>

</body>
</html>
